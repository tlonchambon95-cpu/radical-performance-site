# =====================================================================
#  Publication automatique de Radical Performance
#  -------------------------------------------------------------------
#  Déclenché en poussant une étiquette de version : git tag v2.3.0 && git push --tags
#
#  Ce workflow fait, sur les machines de GitHub, ce qui se faisait à la main :
#    1. vérifie que l'étiquette correspond bien à la version du paquet
#    2. lance check.js (mêmes contrôles qu'en local)
#    3. construit l'installeur Windows
#    4. crée la publication et y joint les TROIS fichiers attendus par
#       electron-updater : l'installeur, latest.yml et le .blockmap
#
#  Le site, lui, se met à jour tout seul : GitHub Pages republie à chaque
#  push sur main, sans intervention de ce workflow.
#
#  IMPORTANT — les publications vont dans radical-performance-downloads,
#  et non dans ce dépôt. C'est imposé : les applications déjà installées
#  chez les clients interrogent cette adresse, gravée dans leur binaire.
#  La changer les couperait définitivement des mises à jour.
#  Cela nécessite un jeton d'accès personnel dans le secret RELEASE_TOKEN
#  (le jeton fourni par défaut ne peut écrire que dans ce dépôt-ci).
# =====================================================================
name: Publier une version

on:
  push:
    tags: ['v*']
  workflow_dispatch:          # permet aussi un lancement manuel depuis l'onglet Actions

permissions:
  contents: read

jobs:
  publier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier que l'étiquette correspond à la version du paquet
        shell: pwsh
        run: |
          $pkg = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "paquet=$pkg  etiquette=$tag"
          if ($tag -and $pkg -ne $tag) {
            Write-Error "L'etiquette v$tag ne correspond pas a la version $pkg de desktop/package.json."
            exit 1
          }

      # Le binaire Electron (~120 Mo) est retelecharge a chaque execution et son
      # echec fait tomber la construction. Le mettre en cache supprime la cause
      # la plus probable des pannes intermittentes, et raccourcit le temps total.
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Installer les dépendances
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Contrôles d'intégrité
        run: node check.js

      # Les journaux de ce depot ne sont pas lisibles sans authentification.
      # Ces controles sont donc decoupes en etapes distinctes : leur NOM et
      # leur resultat sont publics, ce qui suffit a identifier la panne.
      - name: DIAG le secret RELEASE_TOKEN existe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Error "Le secret RELEASE_TOKEN est absent ou vide dans ce depot."
            exit 1
          }
          Write-Host ("Jeton present, longueur " + $env:GH_TOKEN.Length)

      - name: DIAG le jeton peut ecrire dans radical-performance-downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $h = @{ 'User-Agent' = 'rp'; 'Accept' = 'application/vnd.github+json'; 'Authorization' = "Bearer $env:GH_TOKEN" }
          try { $r = Invoke-RestMethod "https://api.github.com/repos/tlonchambon95-cpu/radical-performance-downloads" -Headers $h }
          catch { Write-Error "Le jeton ne peut pas lire le depot de publication."; exit 1 }
          Write-Host ("depot=" + $r.full_name + "  push=" + $r.permissions.push)
          if (-not $r.permissions.push) {
            Write-Error "Le jeton n'a pas l'autorisation Contents: Read and write."
            exit 1
          }

      # electron-builder publie lui-meme : il connait la cible (build.publish
      # dans package.json) et sait exactement quels fichiers joindre, y compris
      # latest.yml qu'il vient de generer. Une etape en moins, et aucun risque
      # d'oublier un fichier dans une liste ecrite a la main.
      - name: Construire et publier
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # Trois tentatives : les echecs observes etaient intermittents et
          # survenaient toujours au meme endroit, sans que le jeton soit en cause.
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            Write-Host "===== tentative $i / 3 ====="
            npm run dist -- --publish always
            if ($LASTEXITCODE -eq 0) { $ok = $true }
            else {
              Write-Host "echec (code $LASTEXITCODE)"
              if ($i -lt 3) { Write-Host "nouvelle tentative dans 20 s..."; Start-Sleep -Seconds 20 }
            }
          }
          if (-not $ok) { Write-Error "La construction a echoue apres 3 tentatives."; exit 1 }

      - name: Vérifier la publication
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $h = @{ 'User-Agent' = 'rp'; 'Accept' = 'application/vnd.github+json' }
          $r = Invoke-RestMethod "https://api.github.com/repos/tlonchambon95-cpu/radical-performance-downloads/releases/tags/$tag" -Headers $h
          $noms = @($r.assets | ForEach-Object { $_.name })
          Write-Host ("publication : " + $r.tag_name + "  brouillon=" + $r.draft + "  prerelease=" + $r.prerelease)
          $r.assets | ForEach-Object { "  {0,-42} {1} Mo" -f $_.name, [math]::Round($_.size/1MB, 1) }
          # Sans latest.yml, aucun client ne detecte la mise a jour : c'est
          # l'erreur silencieuse qu'il faut rendre bloquante.
          $manque = @('RadicalPerformance-Setup.exe','latest.yml','RadicalPerformance-Setup.exe.blockmap') |
                    Where-Object { $noms -notcontains $_ }
          if ($manque.Count) { Write-Error ("Fichiers absents de la publication : " + ($manque -join ', ')); exit 1 }
          if ($r.draft) { Write-Error "La publication est un brouillon : invisible pour les clients."; exit 1 }
