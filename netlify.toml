# Configuration Netlify — Radical Performance
# Site statique : aucune étape de build, Netlify publie directement le contenu du dépôt.

[build]
  publish = "."
  command = ""

# En-têtes de sécurité appliqués à toutes les pages.
# La CSP est stricte et volontairement compatible avec le site tel qu'il est écrit :
# - 'unsafe-inline' est nécessaire pour les <style> et <script> inline du fichier unique ;
# - les polices sont en data: (auto-hébergées, aucune requête vers un serveur de polices) ;
# - connect-src est limite a 'self' : la page n'emet aucune requete vers un tiers.
#   Le numero de version est ecrit dans la page a la construction, et le bouton de
#   telechargement est un simple lien vers GitHub Releases (navigation, pas requete).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Le HTML doit toujours être revalidé pour qu'une mise à jour soit visible immédiatement.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
